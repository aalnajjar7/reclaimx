name: ReclaimX Auto Reply

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull latest
        run: |
          git config user.name "ReclaimX Bot"
          git config user.email "bot@reclaimx.local"
          git pull --rebase || true

      - name: Run responder
        env:
          REPLY_BOT_TOKEN: ${{ secrets.REPLY_BOT_TOKEN }}
          WEBSITE_URL: https://reclaimx.site.je/
        run: python responder.py

      - name: Commit state
        run: |
          git add reply_state.json || true
          git diff --staged --quiet || git commit -m "chore: update reply state [skip ci]"
          git push || true